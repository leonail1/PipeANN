adapter_manifest: /mnt/nvme1n1/PipeANN-github/acceptance/adapter_manifest.openharmony.yaml
results_dir: /mnt/nvme1n1/PipeANN-github/acceptance/results/sift_smoke
work_dir: /mnt/nvme1n1/PipeANN-github/acceptance/work/sift_smoke
target_npoints: 1000
dynamic_cycles: 1
delete_fraction: 0.60
pilot_query_limit: 10
full_query_limit: 20
foreground_search_threads: [1, 2]
k: 10
datasets:
  - name: sift1m_smoke
    base_vectors: /mnt/nvme1n1/PipeANN-github/data/sift1m/sift_base.bin
    query_file: /mnt/nvme1n1/PipeANN-github/data/sift1m/sift_query.bin
    vector_format: fbin
    dimensions: 128
    build_threads: 1
    search_threads: [1]
    insert_batches:
      - name: base_initial
        vectors: /mnt/nvme1n1/PipeANN-github/data/sift1m/sift_base.bin
        count: 1000
      - name: cycle1_replacement
        vectors: /mnt/nvme1n1/PipeANN-github/data/sift1m/sift_base.bin
        ids: /mnt/nvme1n1/PipeANN-github/acceptance/smoke_cycle1_insert.ids
        count: 1000
thresholds:
  expansion_ratio_lt: 2.0
  recall_at_10_min: 0.98
  avg_latency_ms_lt: 10.0
  pilot_skip_latency_ms: 20.0
  delete_ms_per_vector_max: 0.5
  selectivity_abs_tolerance: 1.0e-9
